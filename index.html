<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Morris Translate - Traductor de Subtítulos en Tiempo Real</title>
    <meta name="description" content="Traduce subtítulos de Netflix, Disney+, HBO y más al español en tiempo real. Compatible con Android TV 11.0." />
    <meta name="theme-color" content="#0d1117" />
    <meta name="color-scheme" content="dark" />
    
    <!-- PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    
    <!-- Android TV specific -->
    <meta name="screen-orientation" content="landscape" />
    <meta name="x-content-type-options" content="nosniff" />
    
    <!-- Android TV Leanback support -->
    <meta name="android-app-compatible" content="yes" />
    <meta name="android-large-screen" content="yes" />
    
    <!-- Preconnect for translation API -->
    <link rel="preconnect" href="https://api.mymemory.translated.net" />
    <link rel="dns-prefetch" href="https://api.mymemory.translated.net" />
    
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0d1117;
        overflow: hidden;
      }
      
      /* Loading screen */
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0d1117;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      
      #app-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      .loader-logo {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        background: linear-gradient(135deg, #58a6ff, #1f6feb);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      
      .loader-logo span {
        color: white;
        font-size: 32px;
        font-weight: 900;
        font-family: Arial, sans-serif;
      }
      
      .loader-text {
        color: #58a6ff;
        font-size: 18px;
        font-weight: bold;
        font-family: Arial, sans-serif;
      }
      
      .loader-sub {
        color: #6e7681;
        font-size: 12px;
        margin-top: 8px;
        font-family: Arial, sans-serif;
      }
      
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
    </style>
  </head>
  <body>
    <!-- Loading screen -->
    <div id="app-loader">
      <div class="loader-logo"><span>M</span></div>
      <div class="loader-text">Morris Translate</div>
      <div class="loader-sub">Cargando...</div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      // Hide loader when app is ready
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('app-loader');
          if (loader) loader.classList.add('hidden');
        }, 500);
      });
    </script>
  </body>
</html>
